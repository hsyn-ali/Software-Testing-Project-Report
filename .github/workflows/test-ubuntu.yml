# Extension Task 1 - CI pipeline with GitHub Actions (Ubuntu)
#
# Runs the Selenium test script (test_gateway.py) against the web application
# (index.html) on a GitHub-hosted Ubuntu runner instead of on my own PC.

name: Test Ubuntu

# Manual triggering only: the workflow starts when "Run workflow" is pressed
# on the Actions tab. It does not run on push or pull request.
on:
  workflow_dispatch:

# The job only needs to read the repository, so it gets no write access.
permissions:
  contents: read

jobs:
  selenium-tests:
    # The latest Ubuntu runner image provided by GitHub.
    runs-on: ubuntu-latest

    # Stop the job automatically if it is still running after 30 minutes,
    # so a stalled browser or server cannot use up runner time.
    timeout-minutes: 30

    # Settings read by test_gateway.py.
    env:
      # Address of the web application on the runner. 127.0.0.1 is used
      # instead of "localhost" so the address is the same on every system.
      APP_URL: http://127.0.0.1:8000/index.html
      # The runner has no screen, so Chrome must run without a window.
      HEADLESS: "1"

    steps:
      # (a) Copy the repository files onto the runner.
      - name: Check out the repository code
        uses: actions/checkout@v7

      # (b) Install Python 3.13. The pip cache is saved between runs, using
      # requirements.txt as the key, so later runs install packages faster.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      # (c) Install selenium and pytest from requirements.txt.
      - name: Install dependencies from requirements.txt
        run: python -m pip install -r requirements.txt

      # (d) The Ubuntu runner image already includes Google Chrome and a
      # matching ChromeDriver, so nothing is downloaded here. This step
      # proves both are available and prints their versions in the log.
      # If either is missing the command fails and the job stops here.
      - name: Check Chrome and ChromeDriver are available
        run: |
          google-chrome --version
          chromedriver --version
          chrome_major=$(google-chrome --version | grep -oE '[0-9]+' | head -1)
          driver_major=$(chromedriver --version | grep -oE '[0-9]+' | head -1)
          if [ "$chrome_major" != "$driver_major" ]; then
            echo "::warning::Chrome $chrome_major and ChromeDriver $driver_major have different major versions"
          fi

      # (e) Serve the repository folder with Python's built-in web server.
      # "nohup ... &" keeps it running in the background after this step
      # ends. The loop waits until index.html answers, for up to 20 seconds,
      # so the tests never start before the server is ready.
      - name: Launch the web server
        run: |
          nohup python -m http.server 8000 --bind 127.0.0.1 > web-server.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --silent --fail --output /dev/null "$APP_URL"; then
              echo "Web server is ready after $attempt attempt(s)"
              exit 0
            fi
            sleep 1
          done
          echo "The web server did not start"
          cat web-server.log
          exit 1

      # (f) Run the test script. It reads the test cases from
      # test_cases.csv, launches Chrome, loads the web application, runs
      # every test case and prints PASS or FAIL for each one. If any test
      # case fails, pytest returns an error code and this job fails.
      - name: Run the Selenium tests
        run: python -m pytest test_gateway.py -s -v

      # Keep the screenshots taken by the test script as evidence. This
      # step runs even when a test fails, so failures can be inspected.
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-ubuntu
          path: screenshots/
          if-no-files-found: warn
